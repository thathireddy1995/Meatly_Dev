{% extends "base.html" %}
{% block title %}Log In — Meatly{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-20 px-6 py-10 bg-white rounded-3xl shadow-xl shadow-stone-200/50 border border-stone-100">
    <div class="text-center mb-8">
        <div class="mx-auto w-12 h-12 bg-brand text-white rounded-full grid place-items-center mb-4 text-2xl font-bold">M</div>
        <h1 class="text-3xl font-extrabold text-stone-900">Welcome Back</h1>
        <p class="text-stone-500 mt-2">Log in to your Meatly account</p>
    </div>
    
    <form method="POST" class="space-y-5">
        <div>
            <label for="email" class="block text-sm font-semibold text-stone-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-stone-200 focus:border-brand focus:ring-1 focus:ring-brand outline-none transition" placeholder="you@example.com">
        </div>
        <div>
            <label for="password" class="block text-sm font-semibold text-stone-700 mb-1">Password</label>
            <input type="password" name="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-stone-200 focus:border-brand focus:ring-1 focus:ring-brand outline-none transition" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brand-dark transition shadow-lg shadow-brand/20">
            Log In
        </button>
    </form>
    
    <div class="mt-8 pt-6 border-t border-stone-100 text-center">
        <p class="text-stone-600">Don't have an account? <a href="{{ url_for('register') }}" class="text-brand font-bold hover:underline">Register now</a></p>
    </div>
</div>
{% endblock %}
