<div class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition overflow-hidden flex flex-col">
  <a href="{{ url_for('product_detail', product_id=p.id) }}" class="block aspect-[4/3] overflow-hidden">
    <img src="{{ url_for('static', filename='images/' ~ p.image) }}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="{{ p.name }}">
  </a>
  <div class="p-4 flex-1 flex flex-col">
    <div class="text-xs text-stone-500">{{ p.weight }}</div>
    <a href="{{ url_for('product_detail', product_id=p.id) }}" class="font-semibold mt-1 line-clamp-1 hover:text-brand">{{ p.name }}</a>
    <div class="text-xs text-stone-500 mt-1">★ {{ p.rating }} ({{ p.reviews }})</div>
    <div class="mt-3 flex items-center gap-2">
      <span class="font-bold text-lg">₹{{ p.price }}</span>
      {% if p.mrp > p.price %}<span class="text-sm text-stone-400 line-through">₹{{ p.mrp }}</span>{% endif %}
    </div>
    <form action="{{ url_for('cart_add', product_id=p.id) }}" method="post" class="mt-4">
      <button class="w-full bg-brand text-white py-2.5 rounded-full font-semibold hover:bg-brand-dark transition">Add to Cart</button>
    </form>
  </div>
</div>
